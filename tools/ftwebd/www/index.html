<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0-or-later -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flextight</title>
<style>
:root{--bg:#0d0b0a;--panel:#171311;--line:#2c2420;--ink:#e9e2d8;--dim:#8a7d70;--amber:#ff9a1f;--red:#e5482f;--ok:#7fd17f;--mono:ui-monospace,"SF Mono","Cascadia Mono","DejaVu Sans Mono",Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#1d1512 0,var(--bg) 60%);color:var(--ink);font:15px/1.4 var(--mono);min-height:100vh}
header{display:flex;gap:.8em;align-items:baseline;padding:14px 16px 6px;letter-spacing:.18em;text-transform:uppercase}
header b{color:var(--amber);font-size:13px}header span{color:var(--dim);font-size:11px;flex:1}header a{color:var(--dim);font-size:11px}
main{padding:0 16px 24px;max-width:1100px;margin:0 auto}
h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:400;margin:18px 0 8px}
select,input,button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-height:40px}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{flex:1 1 200px;text-align:left;padding:12px 14px}.card small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}
.res{min-width:118px;text-align:left;padding:8px 12px}.res b{display:block;font-size:20px}.res small{display:block;color:var(--dim);font-size:11px}
.res[aria-pressed=true] small{color:var(--ink)}
label{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin-right:14px}label.off{color:var(--dim)}
.go{background:var(--amber);color:#1a0f00;border-color:var(--amber);font-weight:700;letter-spacing:.12em}
#scan{width:100%;font-size:20px;padding:16px;margin-top:20px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:400}
.note{color:var(--dim);font-size:12px}#st{min-height:1.4em;font-size:13px;padding:4px 0}#st.err{color:var(--red)}
#rv{display:none}
</style></head><body>
<header><b>Flextight</b><span id="crumb">quick scan</span><a href="#">new scan</a><a href="#settings">settings</a></header>
<main id="landing">
<h2>Scan</h2>
<div class="row"><button class="card" aria-pressed="true">Quick scan<small>share-ready prints</small></button><button class="card" disabled>Scan to archive<small>currently unavailable</small></button></div>
<h2>Resolution</h2><div class="row" id="res"></div>
<h2>Film</h2>
<div class="row"><select id="holder" aria-label="Holder"></select><select id="em" aria-label="Emulsion"></select></div>
<h2>Output</h2>
<div class="row"><label><input type="radio" name="out" checked> Local storage</label><label class="off"><input type="radio" name="out" disabled> Network location · under construction</label><label class="off"><input type="radio" name="out" disabled> Cloud · under construction</label></div>
<button id="scan" class="go">SCAN</button>
<div id="st"></div><div id="cont" class="note"></div>
<h2>Recent scans</h2>
<table><thead><tr><th>Date / time</th><th>Type</th><th>Holder</th><th>Emulsion</th></tr></thead><tbody id="recent"></tbody></table>
</main>
<main id="settings" hidden><h2>Settings &amp; maintenance</h2><p class="note">Under construction.</p></main>
<main id="rv"></main>
<script src="review.js" defer></script>
<script>
"use strict";
const $=id=>document.getElementById(id),PPI=[1220,1730,2450,3000,3460,4000];
const PR=new Promise(r=>document.addEventListener("DOMContentLoaded",r));
const W=new Worker("ftweb.js"),calls=new Map();let cid=0;
W.onmessage=e=>{const c=calls.get(e.data.id);calls.delete(e.data.id);e.data.err!=null?c[1](new Error(e.data.err)):c[0](e.data.r)};
const ft=(op,...a)=>new Promise((y,n)=>{calls.set(++cid,[y,n]);W.postMessage({id:cid,op,a})});
function st(m,err){const s=location.hash.startsWith("#s=")&&$("rst")||$("st");s.textContent=m;s.classList.toggle("err",!!err)}
async function api(p,o){const r=await fetch(p,o),t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
 if(!r.ok)throw new Error(j&&j.error?j.error:r.status+" "+r.statusText);return j}
async function get(p,bin){const r=await fetch(p);if(!r.ok)return null;return bin?new Uint8Array(await r.arrayBuffer()):r.text()}
const form=o=>({method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(o)});
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let cur="",ems=[],res=[],choice={};
const S=f=>"/api/strips/"+cur+"/"+f,F=f=>S("files/"+f);
function today(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
// the landing page: choices from the engine, remembered per browser
function pickRes(ppi){choice.ppi=ppi;ls("ppi",""+ppi);for(const b of $("res").children)b.setAttribute("aria-pressed",+b.dataset.ppi===ppi)}
// the engine's lists and this scanner's focus fit, once
let booted=null;
const boot=()=>booted=booted||(async()=>{ems=await ft("emulsions");const l=await get("/api/focus.txt");if(l)await ft("lens",l).catch(e=>st("focus.txt: "+e.message,1))})();
async function landing(){
 try{await boot();res=await ft("resolutions",PPI);const hs=await ft("holders");
  $("em").innerHTML="";for(const e of ems)$("em").append(new Option(e.name,e.id));
  $("holder").innerHTML="";for(const h of hs)$("holder").append(new Option(h.label,h.name));
  $("res").innerHTML="";for(const r of res){const b=document.createElement("button");b.className="res";b.dataset.ppi=r.ppi;
   b.innerHTML="<b>"+r.ppi+"</b><small>ppi · "+r.mp.toFixed(1)+" MP</small><small>Dmax: "+(r.dmax==null?"#N/A":r.dmax.toFixed(2))+"</small>";
   b.onclick=()=>pickRes(r.ppi);$("res").append(b)}
  pickRes(+ls("ppi")||1730);if(ls("em"))$("em").value=ls("em");if(ls("holder"))$("holder").value=ls("holder")}catch(e){st("engine: "+e.message,1)}
 try{const sc=await api("/api/scans"),tb=$("recent");tb.innerHTML="";
  if(!sc.length)tb.innerHTML='<tr><td colspan="4" class="note">coming soon</td></tr>'}catch(e){}
 const last=ls("last");$("cont").innerHTML=last?'continue <a href="#s='+encodeURIComponent(last)+'">'+last+"</a>":""}
$("em").onchange=()=>ls("em",$("em").value);$("holder").onchange=()=>ls("holder",$("holder").value);
const filmOf=id=>((ems.find(e=>e.id===id)||{}).mode==="slide"?"slide":"neg");
// SCAN: a new strip with the choices, its preview, the review screen
$("scan").onclick=async()=>{$("scan").disabled=true;try{
 const t=await api("/api/tasks/current");if(t&&t.state==="running")throw new Error("the scanner is busy: "+t.op+" "+t.strip);
 const l=await api("/api/strips");let c=0;while(l.some(x=>x.name===today()+"_"+String.fromCharCode(97+c)))c++;
 const name=today()+"_"+String.fromCharCode(97+c%26);
 await api("/api/strips",form({name,type:"quick",ppi:choice.ppi,holder:$("holder").value,emulsion:$("em").value}));
 cur=name;await api("/api/tasks",form({op:"preview",strip:name,film:filmOf($("em").value)}));location.hash="s="+encodeURIComponent(name)}
 catch(e){st(e.message,1)}finally{$("scan").disabled=false}};
// screens by the hash: "" landing, #settings, #s=<strip> its review
async function route(){await PR;const h=location.hash.slice(1),s=h.startsWith("s=")?decodeURIComponent(h.slice(2)):"";
 $("landing").hidden=!!h;$("settings").hidden=h!=="settings";$("rv").style.display=s?"block":"none";$("crumb").textContent=s||"quick scan";
 if(s){cur=s;ls("last",s);try{await boot()}catch(e){st("engine: "+e.message,1)}await review(s)}else if(!h){cur="";await landing()}}
addEventListener("hashchange",route);
(async()=>{try{const t=await api("/api/tasks/current");if(t&&t.state==="running"&&!location.hash)location.hash="s="+t.strip}catch(e){}route()})();
</script></body></html>
