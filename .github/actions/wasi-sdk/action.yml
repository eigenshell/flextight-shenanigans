name: wasi-sdk
description: Download the wasi-sdk into $WASI_SDK, cached between runs
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ${{ env.WASI_SDK }}
        key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$WASI_SDK"
        curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION/wasi-sdk-$WASI_SDK_VERSION.0-x86_64-linux.tar.gz" \
          | tar -xz -C "$WASI_SDK" --strip-components=1
