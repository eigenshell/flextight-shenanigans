# Every push: format (fixed and committed back on branches other than main),
# build, a Windows build and the hygiene guard. Every pull request: format,
# hygiene, the full test suite and the sanitizers. Branch protection on main
# makes "format", "hygiene", "test" and "sanitize" required to merge.
name: ci

on:
  push:
  pull_request:
  # the format job starts this for the commit it pushed (see there)
  workflow_dispatch:

# a newer push to the same branch or PR cancels the run still going
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the same wheel the style commit was checked with (23.1.3 == 23.1.4 here)
  CLANG_FORMAT_VERSION: "23.1.3"
  WASI_SDK_VERSION: "34"
  WASI_SDK: /home/runner/wasi-sdk

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the fix commit
      actions: write # the run on it
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install "clang-format==$CLANG_FORMAT_VERSION"
      - name: Format
        run: git ls-files -z '*.c' '*.h' | xargs -0 clang-format -i
      # A push made with the workflow's own token starts no run, so the
      # fixed commit would carry no checks: start one on it by hand.
      - name: Commit the fix
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/heads/') &&
          github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "style: clang-format"
          git push origin "HEAD:$GITHUB_REF_NAME"
          # dispatch needs ci.yml on the default branch: until main has it,
          # push again (or re-run) to get checks on the fixed commit
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME" ||
            echo "::warning::could not start a run on the fixed commit"
      - name: Check formatting
        run: git diff --exit-code --stat

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the added paths of every new commit
      - name: No vendor data, notes, traces or scans
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            range="origin/$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="origin/main..HEAD"
          fi
          .github/hygiene.sh "$range"

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wasi-sdk
      - name: Build everything, failing on any warning
        run: |
          set -o pipefail
          for d in libft sancho tools/poc tools/ftdev tools/ftwebd tools/detail tools/ftweb; do
            echo "::group::$d"
            make -C "$d" 2>&1 | tee -a build.log
            echo "::endgroup::"
          done
          make -C tools/ftweb wasm WASI_SDK="$WASI_SDK" 2>&1 | tee -a build.log
          if grep -n "warning:" build.log; then
            echo "::error::the build printed warnings"
            exit 1
          fi

  # ftpoc.exe as the scanner PC builds it: build.bat, 32-bit mingw
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - name: Build ftpoc.exe with build.bat
        working-directory: tools/poc
        run: |
          set -o pipefail
          cmd //c build.bat 2>&1 | tee build.log
          test -f ftpoc.exe
          if grep -n "warning:" build.log; then
            echo "::error::the Windows build printed warnings"
            exit 1
          fi

  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wasi-sdk
      # node 20 crashes in its GC while the wasm memory grows
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: libft tests
        run: make -C libft test
      - name: ftio and poc tests
        run: make -C tools/poc test
      - name: detail tests
        run: make -C tools/detail test
      - name: Python tests
        run: uv run --extra test --with pytest pytest -q

  # the C suites again under AddressSanitizer and UndefinedBehaviorSanitizer;
  # libft's check skips purity, which would see the sanitizer runtime
  sanitize:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      CFLAGS: >-
        -std=c99 -O1 -g -fno-omit-frame-pointer
        -fsanitize=address,undefined -fno-sanitize-recover=all
        -Wall -Wextra -Wpedantic -Wno-overlength-strings
    steps:
      - uses: actions/checkout@v4
      - name: libft tests
        run: make -C libft check
      - name: ftio and poc tests
        run: make -C tools/poc test
      - name: detail tests
        run: make -C tools/detail test
